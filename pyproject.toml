[project]
name = "evolution-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pygame-ce>=2.5.8",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evosim"
module-root = ""

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]
