name: Exp19 V1.10.1 A2 Vent-Turnover Energy Strategy Evolution

on:
  push:
    branches: [v1.10.1-implementation]
    paths:
      - '.github/workflows/exp19_v1101_a2_energy_evolution.yml'
      - 'experiments/exp19_v1101_a2_energy_evolution/**'
      - 'experiments/exp18_v1101_dynamic_vent/**'
      - 'experiments/exp17_v110_cnp/**'
      - 'experiments/luca_proxy/**'
      - 'experiments/exp15_v19/**'
      - 'experiments/exp15_v19_preflight/**'
      - 'evosim/**'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Full unit test suite (incl. Exp19 harness wiring tests)
        run: uv run pytest -q
      - name: Exp19 source calibration (reuse Exp18 Phase 0 method, no re-tuning)
        run: >-
          uv run python experiments/exp18_v1101_dynamic_vent/phase0.py
          phase0_ci_results.json
      - name: Validate calibration gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          r = json.load(open("phase0_ci_results.json"))
          assert r["dispatch_gate_pass"] is True, r
          print("EXP19_CALIBRATION_PASS")
          print("F0 =", r["P0_A"]["f0_mol_s"], "mol/s per vent")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp19-calibration-check
          path: phase0_ci_results.json
          retention-days: 30
      - name: Upload F0/common-H2-field calibration (consumed by Exp19 runs)
        uses: actions/upload-artifact@v4
        with:
          name: exp19-calibration
          path: |
            f0_calibration.json
            common_initial_h2_field.npy
          retention-days: 30

  exp19_runs:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [E0_STATIC_FIXED, E1_STATIC_EVOLVE, E2_A2_DYNAMIC_FIXED, E3_A2_DYNAMIC_EVOLVE]
        seed: [19001, 19002, 19003]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: exp19-calibration
          path: calibration
      - name: Exp19 ${{ matrix.arm }} seed ${{ matrix.seed }} — 10 physical days
        run: >-
          uv run python experiments/exp19_v1101_a2_energy_evolution/run_exp19.py
          --arm ${{ matrix.arm }}
          --seed ${{ matrix.seed }}
          --days 10
          --calibration-dir calibration
          --outdir result_${{ matrix.arm }}_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp19-run-${{ matrix.arm }}-${{ matrix.seed }}
          path: result_${{ matrix.arm }}_${{ matrix.seed }}
          retention-days: 30

  aggregate:
    needs: exp19_runs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: exp19-run-*
          path: all_runs
      - name: Aggregate Exp19 (mechanical readout only, no PASS/FAIL gate)
        run: >-
          uv run python experiments/exp19_v1101_a2_energy_evolution/aggregate_exp19.py
          --root all_runs
          --out exp19_aggregate.json
          --csv exp19_aggregate.csv
      - name: "Fail loudly on missing/incomplete artifacts (docs §13: no silent skip)"
        shell: bash
        run: |
          python - <<'PY'
          import json
          r = json.load(open("exp19_aggregate.json"))
          if not r["artifacts_complete"]:
              raise SystemExit(f"Exp19 aggregate: artifacts incomplete or n_runs != 12: {r['n_runs']} runs")
          print("EXP19_ARTIFACTS_COMPLETE n_runs =", r["n_runs"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp19-aggregate
          path: |
            exp19_aggregate.json
            exp19_aggregate.csv
          retention-days: 30
