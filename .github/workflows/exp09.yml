name: Exp09

# Exp09 (V1.5 異種一次Energy刺激比較則の診断) を run 単位に並列実行する。
#
# 正本:
#   docs/V1.5_異種刺激比較仕様.md   モデル
#   docs/Exp09_実験計画.md          条件・判定
#   docs/Exp09_実行手順.md          本ワークフローの実行手順
#   docs/V1.5_Exp09_レビュー判断.md 採否判断
#   Issue #41
#
# Exp09は進化競争の実験ではない。診断表現型を全世代固定し、
# 「無次元scoreの順位どおりに一次Energy源が選ばれるか」を見る。
#
# 絶滅・低populationは測定結果なので止めない。一方 Phase 0/A の算術・選択、
# 単独sourceの v1.4-final 一致、条件の排他・遺伝子固定が崩れていたら
# 結果を解釈できないため停止条件にする。
#
# 手動実行のみ。

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "条件 (カンマ区切り。Config名の exp09_<case>.json に対応)"
        type: string
        default: "a_light_only_lightspec,b_chem_only_chemspec,c_mixed_lightspec,d_mixed_chemspec,e_mixed_generalist"
      seeds:
        description: "seed範囲 (例: 1-5。Pilotは 1)"
        type: string
        default: "1-5"
      ticks:
        description: "1 runのtick数 (本番 5000 / Pilot 1000)"
        type: string
        default: "5000"
      upload_events:
        description: "events.csv も保存する (死因の内訳を追える。容量大)"
        type: boolean
        default: false
      render_spatial:
        description: "空間PNG/GIFを生成する (chemicalがある条件はchemical背景)"
        type: boolean
        default: true

concurrency:
  group: exp09
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      seed_count: ${{ steps.gen.outputs.seed_count }}
      seeds: ${{ steps.gen.outputs.seeds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が v1.4-final を参照するため全履歴が必要

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: 条件Configが生成物と一致するか確認
        # 手で編集された/生成し忘れたConfigで25 runを走らせない
        run: uv run python tools/make_exp09_configs.py --check

      - name: Phase 0 / Phase A 決定論診断 (実行前の停止条件)
        # 比較則そのものが壊れていたら本番を走らせない (計画 §5-6)
        run: uv run python tools/bench_exp09.py

      - name: 単独sourceが v1.4-final と完全一致するか (停止条件)
        # V1.5が変えるのは light vs chemical の異種比較だけなので、
        # 単独source世界では旧版とビット単位で一致していなければならない。
        # 226a926 = v1.4-final (branch名はworktreeで解決できないためSHAで指定)
        run: uv run python tools/verify_vs_ref.py --ref 226a926 --single-source

      - name: matrix を生成
        id: gen
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          cases = [c.strip() for c in "${{ inputs.cases }}".split(",") if c.strip()]
          seeds = []
          for part in "${{ inputs.seeds }}".split(","):
              part = part.strip()
              if "-" in part:
                  lo, hi = part.split("-")
                  seeds += list(range(int(lo), int(hi) + 1))
              elif part:
                  seeds.append(int(part))
          items = []
          for c in cases:
              cfg = f"configs/exp09/exp09_{c}.json"
              assert pathlib.Path(cfg).exists(), f"{cfg} が無い"
              for s in seeds:
                  items.append({"case": c, "seed": s})
          assert len(items) <= 256, f"matrix上限256を超える: {len(items)}"
          print("matrix=" + json.dumps({"include": items}))
          print("count=" + str(len(items)))
          print("seed_count=" + str(len(seeds)))
          print("seeds=" + "${{ inputs.seeds }}")
          PY

      - name: 実行計画を表示
        run: |
          {
            echo "### Exp09 実行計画 (V1.4 吸収則の校正)"
            echo "- 条件: ${{ inputs.cases }}"
            echo "- seed: ${{ inputs.seeds }}"
            echo "- ticks: ${{ inputs.ticks }}"
            echo "- 総run数: ${{ steps.gen.outputs.count }}"
            echo "- コード: \`${{ github.sha }}\`"
            echo "- 診断表現型は全世代固定。進化競争は評価しない"
            echo "- 主判定は無次元scoreの順位と実際のsource選択の一致"
          } >> $GITHUB_STEP_SUMMARY

  run:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: シミュレーション実行
        run: |
          uv run python main.py --headless \
            --ticks "${{ inputs.ticks }}" \
            --seed "${{ matrix.seed }}" \
            --config "configs/exp09/exp09_${{ matrix.case }}.json" \
            --out "runs/exp09_${{ matrix.case }}"

      - name: 空間PNG/GIFを生成
        if: ${{ inputs.render_spatial }}
        continue-on-error: true
        run: |
          SRC=$(find "runs/exp09_${{ matrix.case }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          case "${{ matrix.case }}" in
            a_*) BG=light ;;
            *)   BG=chemical ;;
          esac
          uv run python tools/render_spatial.py "$SRC" --background "$BG" --gif --fps 6

      - name: 保存対象を整理
        run: |
          set -euo pipefail
          SRC=$(find "runs/exp09_${{ matrix.case }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          DST="artifact/$(basename "$SRC")"
          mkdir -p "$DST"
          cp "$SRC"/config.json "$SRC"/meta.json "$SRC"/stats.csv "$SRC"/lineages.csv "$DST"/
          cp -r "$SRC"/snapshots "$SRC"/environment "$DST"/
          if [ -d "$SRC/spatial" ]; then cp -r "$SRC"/spatial "$DST"/; fi
          if [ "${{ inputs.upload_events }}" = "true" ]; then cp "$SRC"/events.csv "$DST"/; fi
          echo "最終tick: $(tail -1 "$SRC"/stats.csv | cut -d, -f1) / 個体数: $(tail -1 "$SRC"/stats.csv | cut -d, -f2)"
          du -sh "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: exp09-${{ matrix.case }}-seed${{ matrix.seed }}
          path: artifact/
          retention-days: 90

  collect:
    needs: [setup, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      REMOTE_BASE: ${{ vars.RCLONE_REMOTE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: 全runの成果物を取得
        uses: actions/download-artifact@v4
        with:
          pattern: exp09-*
          path: dl

      - name: 条件ごとに再構成
        run: |
          mkdir -p runs/exp09
          for d in dl/exp09-*; do
            name=$(basename "$d")
            key=$(echo "$name" | sed -E 's/^exp09-(.+)-seed[0-9]+$/\1/')
            mkdir -p "runs/exp09/$key"
            cp -r "$d"/* "runs/exp09/$key"/ 2>/dev/null || true
          done
          echo "=== 条件ごとのrun数 ==="
          for c in runs/exp09/*; do
            echo "$(basename $c): $(find $c -mindepth 1 -maxdepth 1 -type d | wc -l) run"
          done
          du -sh runs/exp09

      - name: 数値実行環境の同一性を確認
        run: uv run python tools/check_env.py runs/exp09/* 2>&1 | tee env_check.txt

      - name: 健全性チェック (run数・環境・コード)
        # 絶滅による早期終了は測定結果であり、health_check も警告に留める
        id: health
        continue-on-error: true
        env:
          TICKS: ${{ inputs.ticks }}
          EXPECT_RUNS: ${{ needs.setup.outputs.seed_count }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/health_check.py runs/exp09/* --ticks "$TICKS" --expect-runs "$EXPECT_RUNS" 2>&1 | tee health.txt || rc=$?
          {
            echo ""
            echo "### 健全性チェック"
            echo "> Exp09では早期終了 (絶滅) ・低vent滞在率は測定結果であり異常ではない。"
            echo '```'
            tail -60 health.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 診断条件の成立チェック (排他・default・表現型固定・score順位一致)
        id: conditions
        continue-on-error: true
        env:
          SEEDS: ${{ needs.setup.outputs.seeds }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/check_exp09.py runs/exp09 --seeds "$SEEDS" 2>&1 | tee conditions.txt || rc=$?
          {
            echo ""
            echo "<details><summary>診断条件チェック</summary>"
            echo ""
            echo '```'
            tail -40 conditions.txt
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 校正結果を要約
        env:
          TICKS: ${{ inputs.ticks }}
        run: |
          set -o pipefail
          uv run python tools/summarize_exp09.py runs/exp09 --ticks "$TICKS" 2>&1 | tee summary.txt
          {
            echo ""
            echo "## Exp09 校正結果 (GitHub Actions / Linux)"
            echo ""
            echo "> 光とchemicalの優劣は判定しない。V1.5比較則そのものの妥当性検証 (計画 §1, §11)。"
            echo "> 主判定は score順位と実選択の一致。選択率やvent滞在率の水準では判定しない。"
            echo "> 占有中のventはstockが下がるため、交差点を下回ればlightを選ぶのが式どおり。"
            echo ""
            echo '```'
            cat env_check.txt
            echo '```'
            echo ""
            echo '```'
            cat summary.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 条件ごとのseed間集計
        continue-on-error: true
        run: |
          for c in runs/exp09/*; do
            uv run python tools/run_batch.py --aggregate "$c" 2>&1 | tail -8
          done

      # --- 生データのアーカイブとマニフェスト ---

      - name: 生データを圧縮しマニフェストを生成
        id: pack
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          EXP="exp09_actions_${STAMP}"
          echo "exp=$EXP" >> "$GITHUB_OUTPUT"
          mkdir -p archives "experiments/$EXP"
          for c in runs/exp09/*; do
            name="exp09_$(basename "$c")"
            tar -czf "archives/${name}.tar.gz" -C "$(dirname "$c")" "$(basename "$c")"
            REMOTE=""
            if [ -n "${REMOTE_BASE:-}" ]; then
              REMOTE="${REMOTE_BASE}/${EXP}/${name}.tar.gz"
            fi
            uv run python tools/make_manifest.py "$c" \
              --out "experiments/$EXP/$name" \
              --archive "archives/${name}.tar.gz" \
              ${REMOTE:+--remote "$REMOTE"}
          done
          cp summary.txt env_check.txt "experiments/$EXP/"
          if [ -f conditions.txt ]; then cp conditions.txt "experiments/$EXP/"; fi
          if [ -f health.txt ]; then cp health.txt "experiments/$EXP/"; fi
          echo "=== アーカイブ ==="
          du -sh archives/

      - name: Google Drive へ生データを転送
        id: upload
        if: env.RCLONE_CONF != '' && env.REMOTE_BASE != ''
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy archives/ "${REMOTE_BASE}/${EXP}/" --progress --stats-one-line
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/rclone/rclone.conf

      - name: 転送状況を記録
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          if [ "${{ steps.upload.outputs.uploaded }}" = "true" ]; then
            MSG="生データを外部ストレージへ転送済み"
          else
            MSG="外部ストレージ未設定のため、生データは Actions 成果物のみ (90日保持)"
          fi
          echo "$MSG"
          {
            echo ""
            echo "### 生データ"
            echo "- $MSG"
            echo "- マニフェスト: \`experiments/$EXP/*/MANIFEST.md\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: 要約とチェックサムを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: exp09-summary
          path: experiments/
          retention-days: 90

      - name: 生データアーカイブを成果物として保存 (転送未設定時の保険)
        if: ${{ steps.upload.outputs.uploaded != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: exp09-rawdata
          path: archives/
          retention-days: 90

      - name: 停止条件の判定
        if: ${{ steps.health.outcome == 'failure' || steps.conditions.outcome == 'failure' }}
        run: |
          echo "::error::健全性チェックまたは診断条件チェックが停止条件に該当した (health.txt / conditions.txt 参照)"
          {
            echo ""
            echo "### ★ 停止条件に該当"
            echo "診断の前提が崩れているため、この結果を解釈してはいけない。"
            echo "生データと成果物は退避済み。原因を解消して再実行すること。"
          } >> $GITHUB_STEP_SUMMARY
          exit 1
