name: Exp15 V1.9 LUCA Proxy

on:
  push:
    branches: [claude/pr-50-v1.6-exp11-iuhnzm]
    paths:
      - '.github/workflows/exp15_luca_proxy.yml'
      - 'experiments/luca_proxy/**'
      - 'docs/V1.9_LUCA_proxy設計.md'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Existing V1.9 tests
        run: uv run pytest tests/test_v19_iluca.py tests/test_v13_chemical_source.py tests/test_v14_uptake.py -q
      - name: LUCA proxy policy tests
        run: uv run pytest experiments/luca_proxy/test_luca_proxy_policy.py -q
      - name: LUCA proxy 6-hour sanity
        run: >-
          uv run python experiments/luca_proxy/run_luca_proxy.py
          --arm A --seed 15001 --days 0.25 --outdir sanity_A_15001
      - name: Validate sanity
        shell: bash
        run: |
          python - <<'PY'
          import json
          s = json.load(open("sanity_A_15001/summary.json"))
          assert s["population_final"] > 0, s
          assert s["stop_reason"] != "extinction", s
          assert abs(s["energy_ledger_residual_j"]) < 1e-12, s
          assert abs(s["matter_ledger_residual_matter"]) < 1e-9, s
          print("LUCA_SANITY_PASS", {
              "population_final": s["population_final"],
              "max_generation": s["max_generation"],
              "energy_residual": s["energy_ledger_residual_j"],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luca-proxy-sanity
          path: sanity_A_15001
          retention-days: 30

  phase_a:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [15001, 15002, 15003, 15004, 15005]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Phase A fixed LUCA proxy — 10 physical days
        run: >-
          uv run python experiments/luca_proxy/run_luca_proxy.py
          --arm A --seed ${{ matrix.seed }} --days 10
          --outdir result_A_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp15-luca-A-${{ matrix.seed }}
          path: result_A_${{ matrix.seed }}
          retention-days: 30

  gate:
    needs: phase_a
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      pass: ${{ steps.eval.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: exp15-luca-A-*
          path: gate_input
      - name: Evaluate preregistered Phase-A adequacy gate
        id: eval
        shell: bash
        run: |
          uv run python experiments/exp15_v19/aggregate_exp15.py --root gate_input --out phase_a_gate.json --gate-only
          PASS=$(python -c 'import json; print(str(json.load(open("phase_a_gate.json"))["phase_a_gate"]["pass"]).lower())')
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "PHASE_A_GATE=$PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: exp15-luca-phase-a-gate
          path: phase_a_gate.json
          retention-days: 30

  phase_b:
    needs: gate
    if: needs.gate.outputs.pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [15001, 15002, 15003, 15004, 15005]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Phase B three-gene evolution from LUCA proxy — 10 physical days
        run: >-
          uv run python experiments/luca_proxy/run_luca_proxy.py
          --arm B --seed ${{ matrix.seed }} --days 10
          --outdir result_B_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp15-luca-B-${{ matrix.seed }}
          path: result_B_${{ matrix.seed }}
          retention-days: 30

  aggregate:
    needs: [gate, phase_b]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: exp15-luca-?-[0-9]*
          path: all_runs
      - name: Aggregate LUCA-proxy results
        run: uv run python experiments/exp15_v19/aggregate_exp15.py --root all_runs --out exp15_luca_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp15-v19-luca-proxy-aggregate
          path: exp15_luca_aggregate.json
          retention-days: 30
