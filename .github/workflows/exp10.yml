name: Exp10

# Exp10 Phase B (V1.6 temporal biased random walk の生態検証) を
# run 単位に並列実行する。
#
# 正本:
#   docs/V1.6_行動則設計案.md   モデル
#   docs/Exp10_実験計画案.md    条件・判定
#   docs/V1.6_Exp10_レビュー.md 実測に基づくレビュー
#   Issue #41
#
# Phase A (軽量synthetic arena) はローカルで走らせ、その結果から事前登録規則
# (§4.7 最小response_gain → 同gainなら最短memory_tau) で選んだ1候補を
# configs/exp10/phaseA_selection.json としてcommitしてある。
# 本workflowはその1候補だけをfull simulationへ持ち込む (計画 §5)。
#
# 絶滅・低populationは測定結果なので原則止めない。ただし
# **chemical-only treatment の生存は §5.5 の重要停止条件**である。
#
# 手動実行のみ。

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "条件 (カンマ区切り。Config名の exp10_<case>.json に対応)"
        type: string
        default: "b1_light_only_lightspec_control,b1_light_only_lightspec_treatment,b2_chem_only_chemspec_control,b2_chem_only_chemspec_treatment,b3_mixed_lightspec_control,b3_mixed_lightspec_treatment,b4_mixed_chemspec_control,b4_mixed_chemspec_treatment,b5_mixed_generalist_control,b5_mixed_generalist_treatment"
      seeds:
        description: "seed範囲 (本番 1-20 / Pilot 1)"
        type: string
        default: "1-20"
      ticks:
        description: "1 runのtick数 (Phase B 10000 / Phase C 30000 / Pilot 1000)"
        type: string
        default: "10000"
      upload_events:
        description: "events.csv も保存する (死因の内訳を追える。容量大)"
        type: boolean
        default: false
      render_spatial:
        description: "空間PNG/GIFを生成する"
        type: boolean
        default: true

concurrency:
  group: exp10
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      seed_count: ${{ steps.gen.outputs.seed_count }}
      seeds: ${{ steps.gen.outputs.seeds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が過去のrefを参照するため全履歴が必要

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: 条件Configが生成物と一致するか確認
        # 手で編集された/生成し忘れたConfigで200 runを走らせない。
        # Phase A選定値 (phaseA_selection.json) との整合もここで効く。
        run: uv run python tools/make_exp10_configs.py --check

      - name: Phase 0 決定論診断 (実行前の停止条件)
        # 計画 §3 の15項目。行動則そのものが壊れていたら本番を走らせない
        run: uv run pytest tests/test_v16_temporal.py -q

      - name: 保存則・決定性の確認 (停止条件)
        run: uv run pytest tests/test_conservation.py tests/test_determinism.py -q

      - name: matrix を生成
        id: gen
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          cases = [c.strip() for c in "${{ inputs.cases }}".split(",") if c.strip()]
          seeds = []
          for part in "${{ inputs.seeds }}".split(","):
              part = part.strip()
              if "-" in part:
                  lo, hi = part.split("-")
                  seeds += list(range(int(lo), int(hi) + 1))
              elif part:
                  seeds.append(int(part))
          items = []
          for c in cases:
              cfg = f"configs/exp10/exp10_{c}.json"
              assert pathlib.Path(cfg).exists(), f"{cfg} が無い"
              for s in seeds:
                  items.append({"case": c, "seed": s})
          assert len(items) <= 256, f"matrix上限256を超える: {len(items)}"
          print("matrix=" + json.dumps({"include": items}))
          print("count=" + str(len(items)))
          print("seed_count=" + str(len(seeds)))
          print("seeds=" + "${{ inputs.seeds }}")
          PY

      - name: 実行計画を表示
        run: |
          {
            echo "### Exp10 Phase B 実行計画 (V1.6 行動則の生態検証)"
            echo "- 条件: ${{ inputs.cases }}"
            echo "- seed: ${{ inputs.seeds }}"
            echo "- ticks: ${{ inputs.ticks }}"
            echo "- 総run数: ${{ steps.gen.outputs.count }}"
            echo "- コード: \`${{ github.sha }}\`"
            echo "- 診断表現型は全世代固定。進化はOFF"
            echo "- control は response_gain=0 の pure random walk"
            echo "- **重要停止条件**: chemical-only treatment が 20 seed中18以上生存 (§5.5)"
            echo ""
            echo '```'
            cat configs/exp10/phaseA_selection.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  run:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: シミュレーション実行
        run: |
          uv run python main.py --headless \
            --ticks "${{ inputs.ticks }}" \
            --seed "${{ matrix.seed }}" \
            --config "configs/exp10/exp10_${{ matrix.case }}.json" \
            --out "runs/exp10_${{ matrix.case }}"

      - name: 空間PNG/GIFを生成
        if: ${{ inputs.render_spatial }}
        continue-on-error: true
        run: |
          SRC=$(find "runs/exp10_${{ matrix.case }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          case "${{ matrix.case }}" in
            b1_*) BG=light ;;
            *)    BG=chemical ;;
          esac
          uv run python tools/render_spatial.py "$SRC" --background "$BG" --gif --fps 4

      - name: 保存対象を整理
        run: |
          set -euo pipefail
          SRC=$(find "runs/exp10_${{ matrix.case }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          DST="artifact/$(basename "$SRC")"
          mkdir -p "$DST"
          cp "$SRC"/config.json "$SRC"/meta.json "$SRC"/stats.csv "$SRC"/lineages.csv "$DST"/
          cp -r "$SRC"/snapshots "$SRC"/environment "$DST"/
          if [ -d "$SRC/spatial" ]; then cp -r "$SRC"/spatial "$DST"/; fi
          if [ "${{ inputs.upload_events }}" = "true" ]; then cp "$SRC"/events.csv "$DST"/; fi
          echo "最終tick: $(tail -1 "$SRC"/stats.csv | cut -d, -f1) / 個体数: $(tail -1 "$SRC"/stats.csv | cut -d, -f2)"
          du -sh "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: exp10-${{ matrix.case }}-seed${{ matrix.seed }}
          path: artifact/
          retention-days: 90

  collect:
    needs: [setup, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      REMOTE_BASE: ${{ vars.RCLONE_REMOTE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: 全runの成果物を取得
        uses: actions/download-artifact@v4
        with:
          pattern: exp10-*
          path: dl

      - name: 条件ごとに再構成
        run: |
          mkdir -p runs/exp10
          for d in dl/exp10-*; do
            name=$(basename "$d")
            key=$(echo "$name" | sed -E 's/^exp10-(.+)-seed[0-9]+$/\1/')
            mkdir -p "runs/exp10/$key"
            cp -r "$d"/* "runs/exp10/$key"/ 2>/dev/null || true
          done
          echo "=== 条件ごとのrun数 ==="
          for c in runs/exp10/*; do
            echo "$(basename $c): $(find $c -mindepth 1 -maxdepth 1 -type d | wc -l) run"
          done
          du -sh runs/exp10

      - name: 数値実行環境の同一性を確認
        id: env
        continue-on-error: true
        run: |
          set -o pipefail
          # --strict: 環境が混在していたら整合性違反として非ゼロ終了する
          # (Issue #41 再トライアル方針 §6: 環境不一致は workflow failure)。
          uv run python tools/check_env.py --strict runs/exp10/* 2>&1 | tee env_check.txt

      - name: 健全性チェック (run数・環境・コード)
        id: health
        continue-on-error: true
        env:
          TICKS: ${{ inputs.ticks }}
          EXPECT_RUNS: ${{ needs.setup.outputs.seed_count }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/health_check.py runs/exp10/* --ticks "$TICKS" --expect-runs "$EXPECT_RUNS" 2>&1 | tee health.txt || rc=$?
          {
            echo ""
            echo "### 健全性チェック"
            echo "> Exp10では絶滅・早期終了は測定結果である。ただし chemical-only"
            echo "> treatment の生存だけは §5.5 の重要停止条件として別に判定する。"
            echo '```'
            tail -60 health.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 診断条件の成立チェック (default・行動則パラメータ・排他・表現型固定)
        id: conditions
        continue-on-error: true
        env:
          SEEDS: ${{ needs.setup.outputs.seeds }}
          CASES: ${{ inputs.cases }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/check_exp10.py runs/exp10 --seeds "$SEEDS" --cases "$CASES" 2>&1 | tee conditions.txt || rc=$?
          {
            echo ""
            echo "<details><summary>診断条件チェック</summary>"
            echo ""
            echo '```'
            tail -40 conditions.txt
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Phase B の要約と事前登録判定
        id: summary
        continue-on-error: true
        env:
          TICKS: ${{ inputs.ticks }}
          CASES: ${{ inputs.cases }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/summarize_exp10_phaseB.py runs/exp10 --ticks "$TICKS" --cases "$CASES" 2>&1 | tee summary.txt || rc=$?
          {
            echo ""
            echo "## Exp10 Phase B 結果 (GitHub Actions / Linux)"
            echo ""
            echo "> V1.6行動則が生態を壊さないかを見る。行動則の局所的な正しさは"
            echo "> Phase A (synthetic arena) が担当する。"
            echo "> 進化はOFF・診断表現型は全世代固定。長期進化的優劣は結論しない (§9)。"
            echo ""
            echo '```'
            cat env_check.txt
            echo '```'
            echo ""
            echo '```'
            cat summary.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 条件ごとのseed間集計
        continue-on-error: true
        run: |
          for c in runs/exp10/*; do
            uv run python tools/run_batch.py --aggregate "$c" 2>&1 | tail -8
          done

      # --- 生データのアーカイブとマニフェスト ---

      - name: 生データを圧縮しマニフェストを生成
        id: pack
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          EXP="exp10_actions_${STAMP}"
          echo "exp=$EXP" >> "$GITHUB_OUTPUT"
          mkdir -p archives "experiments/$EXP"
          for c in runs/exp10/*; do
            name="exp10_$(basename "$c")"
            tar -czf "archives/${name}.tar.gz" -C "$(dirname "$c")" "$(basename "$c")"
            REMOTE=""
            if [ -n "${REMOTE_BASE:-}" ]; then
              REMOTE="${REMOTE_BASE}/${EXP}/${name}.tar.gz"
            fi
            uv run python tools/make_manifest.py "$c" \
              --out "experiments/$EXP/$name" \
              --archive "archives/${name}.tar.gz" \
              ${REMOTE:+--remote "$REMOTE"}
          done
          cp summary.txt env_check.txt "experiments/$EXP/"
          cp configs/exp10/phaseA_selection.json "experiments/$EXP/"
          if [ -f conditions.txt ]; then cp conditions.txt "experiments/$EXP/"; fi
          if [ -f health.txt ]; then cp health.txt "experiments/$EXP/"; fi
          echo "=== アーカイブ ==="
          du -sh archives/

      - name: Google Drive へ生データを転送
        id: upload
        if: env.RCLONE_CONF != '' && env.REMOTE_BASE != ''
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy archives/ "${REMOTE_BASE}/${EXP}/" --progress --stats-one-line
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/rclone/rclone.conf

      - name: 転送状況を記録
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          if [ "${{ steps.upload.outputs.uploaded }}" = "true" ]; then
            MSG="生データを外部ストレージへ転送済み"
          else
            MSG="外部ストレージ未設定のため、生データは Actions 成果物のみ (90日保持)"
          fi
          echo "$MSG"
          {
            echo ""
            echo "### 生データ"
            echo "- $MSG"
            echo "- マニフェスト: \`experiments/$EXP/*/MANIFEST.md\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: 要約とチェックサムを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: exp10-summary
          path: experiments/
          retention-days: 90

      - name: 生データアーカイブを成果物として保存 (転送未設定時の保険)
        if: ${{ steps.upload.outputs.uploaded != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: exp10-rawdata
          path: archives/
          retention-days: 90

      # 整合性違反 (実行失敗) だけを workflow failure にする。
      # 科学的な STOP/REVIEW (絶滅・低population・§5.5未達・§8-3/§8-4未確認) は
      # 正常に完走した測定結果なので workflow を落とさない
      # (Issue #41 再トライアル方針 §6)。
      #   環境不一致    → steps.env         (check_env --strict)
      #   run不足・環境  → steps.health      (health_check)
      #   Config/排他/固定表現型違反 → steps.conditions (check_exp10)
      #   供給側の物理破壊 → steps.summary   (§8-7。科学判定は exit 0 のまま)
      - name: 整合性違反の判定 (実行失敗のみ workflow を落とす)
        if: ${{ steps.env.outcome == 'failure' || steps.health.outcome == 'failure' || steps.conditions.outcome == 'failure' || steps.summary.outcome == 'failure' }}
        run: |
          echo "::error::整合性違反 (環境不一致・run不足・固定表現型違反・物理破壊のいずれか)"
          {
            echo ""
            echo "### ★ 整合性違反 — 実行失敗"
            echo "env_check.txt / health.txt / conditions.txt / summary.txt を確認すること。"
            echo "これは実験の実行そのものの失敗であり、修正して再実行が必要。"
            echo "科学的な STOP/REVIEW (§5.5 の生存など) は別扱いで、summary.txt に"
            echo "「科学的判定」として出る (workflow は落とさない)。"
            echo "生データと成果物は退避済み。"
          } >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: 科学的判定を要約へ明記
        if: ${{ steps.env.outcome != 'failure' && steps.health.outcome != 'failure' && steps.conditions.outcome != 'failure' && steps.summary.outcome != 'failure' }}
        run: |
          {
            echo ""
            echo "### 整合性 OK — 実行は成功"
            echo "科学的な PASS/STOP/REVIEW は summary.txt の「科学的判定」を参照。"
            echo "とくに chemical-only treatment の生存 (§5.5) が STOP のときは、"
            echo "V1.6 default化を止める科学的判断材料になる (実行の失敗ではない)。"
          } >> $GITHUB_STEP_SUMMARY
