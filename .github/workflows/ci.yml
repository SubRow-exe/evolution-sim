name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が過去のrefを参照するため全履歴が必要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests (決定性・保存則・スモーク)
        run: uv run pytest tests -q
      - name: 結果不変性の検証 (実装同士を直接比較)
        # 指紋はOS依存のため定数比較はできない。同一マシン上で
        # 参照実装と現在の実装を実際に走らせて比較する。
        #
        # V1.3は世界ルール変更境界なので、V1.2以前とは意図的に結果が異なる。
        # V1.3内の結果不変変更は、最初のV1.3実装コミット ea78125 を基準にする。
        # Repository variable が古い値のまま残っていても基準を上書きしないよう、
        # このworkflowではrefを明示的に固定する。
        # V1.2以前の再現は v1.2-final を使用する。
        run: uv run python tools/verify_vs_ref.py --ref ea78125
