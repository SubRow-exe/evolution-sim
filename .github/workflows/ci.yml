name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が過去のrefを参照するため全履歴が必要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests (決定性・保存則・スモーク)
        run: uv run pytest tests -q
      - name: 結果不変性の検証 (実装同士を直接比較)
        # 指紋はOS依存のため定数比較はできない。同一マシン上で
        # 参照実装と現在の実装を実際に走らせて比較する。
        #
        # V1.5は世界ルール変更境界 (行動の異種刺激比較) なので、V1.4以前とは
        # 意図的に結果が異なる。V1.5内の結果不変変更は、最初のV1.5実装コミット
        # 8b064ee を基準にする。単独source世界がV1.4と一致することは
        # verify_vs_ref.py --ref 226a926 --single-source で別途確認する。
        # Repository variable が古い値のまま残っていても基準を上書きしないよう、
        # このworkflowではrefを明示的に固定する。
        # 過去バージョンの再現は v1.2-final / v1.3-final / v1.4-final を使用する。
        run: uv run python tools/verify_vs_ref.py --ref 8b064ee
