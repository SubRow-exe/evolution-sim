name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が過去のrefを参照するため全履歴が必要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests (決定性・保存則・スモーク)
        run: uv run pytest tests -q
      - name: 結果不変性の検証 (実装同士を直接比較)
        # 指紋はOS依存のため定数比較はできない。同一マシン上で
        # 参照実装と現在の実装を実際に走らせて比較する。
        #
        # 既定refは**世界バージョン境界ごとに更新する**。世界ルールを
        # 変えた版と旧版を比較すれば必ず不一致になるため、基準点は
        # 現行バージョンの最初のコミットに置く。
        #   V1.1-V1.2: 18137b5
        #   V1.3-    : ea78125 (chemicalを地質sourceモデルへ変更)
        # V1.2以前の再現は v1.2-final を使う。
        run: uv run python tools/verify_vs_ref.py --ref ${{ vars.RESULT_BASELINE_REF || 'ea78125' }}
