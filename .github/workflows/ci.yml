name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_vs_ref が過去のrefを参照するため全履歴が必要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests (決定性・保存則・スモーク)
        run: uv run pytest tests -q
      - name: 結果不変性の検証 (実装同士を直接比較)
        # 指紋はOS依存のため定数比較はできない。同一マシン上で
        # 参照実装と現在の実装を実際に走らせて比較する。
        #
        # V1.6は世界ルール変更境界 (一次Energyの移動則を temporal biased
        # random walk へ変更) なので、V1.5以前とは意図的に結果が異なる。
        #
        # V1.7は bmr_core default を 0.0 -> 0.15 へ変更する境界 (docs/V1.7_総括.md)。
        # 意図した結果変更のため、V1.6基準の1c708beのままでは誤検知する。
        # V1.7内の結果不変変更は 2edc3db (V1.7 close確定commit = v1.7-final)
        # を基準にした。
        #
        # V1.8は一次Energy吸収を仕様追加したが、選定前defaultは全てfeature
        # OFF (V1.7完全回帰) だったため、V1.7基準 (2edc3db) のままで問題なく
        # 検証できていた。
        #
        # V1.9はchemical-first iLUCA再設計 (docs/V1.9_iLUCA再設計仕様.md) で、
        # world rule / INITIAL_GENOME をfeature flag無しで直接変更する境界
        # なので、V1.7/V1.8基準の2edc3dbのままでは誤検知する
        # (world.chemical -> world.h2 のfield rename等でV1.7/V1.8側の
        # golden.pyがそもそも実行できない)。V1.9内の結果不変変更は
        # b9e7a2e (V1.9実装確定commit) を基準にする。
        #
        # V1.6/V1.7/V1.9は世界ルールそのものを変えるため、それ以前との
        # 単独source一致 (--single-source) は成立しない。過去バージョンの
        # 再現は v1.2-final / v1.3-final / v1.4-final / v1.5-final /
        # v1.6-final / v1.7-final / v1.8-final を使用する。
        # Repository variable が古い値のまま残っていても基準を上書きしないよう、
        # このworkflowではrefを明示的に固定する。
        run: uv run python tools/verify_vs_ref.py --ref b9e7a2e
