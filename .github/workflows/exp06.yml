name: Exp06

# Exp06 (chemical利用経路の成立性診断) を run 単位に並列実行する。
#
# 正本:
#   docs/Exp06_実験計画.md   条件・判定ロジック
#   docs/Exp06_実行手順.md   本ワークフローの実行手順
#   Issue #34
#
# ## Exp05 との違い
#
# Exp05は光環境の比較実験だが、Exp06は**診断**である。
# 全条件 light_max=0 で、祖先/chem-adapted × ランダム配置/vent配置の2×2から
# 「chemical経路が成立するか、どこがボトルネックか」を切り分ける。
#
# 絶滅は異常ではなく**測定対象**なので、health_check の早期終了警告で止めない。
# 一方で「診断条件が意図どおりだったか」(光0・vent配置・chem固定2.0) が
# 崩れていたら結果を解釈できないため、check_exp06.py は停止条件にする。
#
# chemical_absorption=2.0 は診断用の positive control であり、
# 次期バージョンの初期値候補ではない。
#
# 手動実行のみ。

on:
  workflow_dispatch:
    inputs:
      conditions:
        description: "条件 (カンマ区切り)。configs/exp06_<条件>.json が必要"
        type: string
        default: "a_ancestor_random,b_ancestor_vent,c_chem_vent,d_chem_random"
      seeds:
        description: "seed範囲 (例: 1-10。追加投入時は 11-20)"
        type: string
        default: "1-10"
      ticks:
        description: "1 runのtick数"
        type: string
        default: "10000"
      upload_events:
        description: "events.csv も保存する (死因の内訳を追跡できる)"
        type: boolean
        default: true
      render_spatial:
        description: "chemical背景のPNG/GIFを生成する (光0なのでlight背景は使わない)"
        type: boolean
        default: true

concurrency:
  group: exp06
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      seed_count: ${{ steps.gen.outputs.seed_count }}
      seed_list: ${{ steps.gen.outputs.seed_list }}
    steps:
      - uses: actions/checkout@v4

      - name: 条件Configと診断条件を確認
        # 存在しない条件名や light!=0 のConfigで40 runを走らせてから
        # 気づくのを防ぐ
        run: |
          set -e
          IFS=',' read -ra CONDS <<< "${{ inputs.conditions }}"
          for c in "${CONDS[@]}"; do
            c="$(echo "$c" | xargs)"
            f="configs/exp06_${c}.json"
            test -f "$f" || { echo "::error::$f がない"; exit 1; }
            python - "$f" <<'PY'
          import json, sys
          cfg = json.load(open(sys.argv[1], encoding="utf-8"))
          assert cfg["light_max"] == 0.0, f"{sys.argv[1]}: light_max が0でない"
          ov = cfg.get("diagnostic_gene_overrides") or {}
          for name in ov:
              assert name in (cfg.get("fixed_genes") or []), \
                  f"{sys.argv[1]}: {name} が fixed_genes にない"
          print(f"{sys.argv[1]}: light_max=0 placement={cfg['diagnostic_placement']} "
                f"overrides={ov} fixed={cfg.get('fixed_genes')}")
          PY
          done

      - name: matrix を生成
        id: gen
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          conds = [c.strip() for c in "${{ inputs.conditions }}".split(",") if c.strip()]
          spec = "${{ inputs.seeds }}"
          seeds = []
          for part in spec.split(","):
              part = part.strip()
              if "-" in part:
                  lo, hi = part.split("-")
                  seeds += list(range(int(lo), int(hi) + 1))
              elif part:
                  seeds.append(int(part))
          items = [{"condition": c, "seed": s} for c in conds for s in seeds]
          assert len(items) <= 256, f"matrix上限256を超える: {len(items)}"
          print("matrix=" + json.dumps({"include": items}))
          print("count=" + str(len(items)))
          print("seed_count=" + str(len(seeds)))
          print("seed_list=" + ",".join(str(s) for s in seeds))
          PY

      - name: 実行計画を表示
        run: |
          echo "### Exp06 実行計画 (chemical経路の成立性診断)" >> $GITHUB_STEP_SUMMARY
          echo "- 条件: ${{ inputs.conditions }}" >> $GITHUB_STEP_SUMMARY
          echo "- seed: ${{ inputs.seeds }}" >> $GITHUB_STEP_SUMMARY
          echo "- ticks: ${{ inputs.ticks }}" >> $GITHUB_STEP_SUMMARY
          echo "- 総run数: ${{ steps.gen.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "- コード: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 全条件 light_max=0。絶滅は異常ではなく測定対象" >> $GITHUB_STEP_SUMMARY

  run:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false        # 1 run の失敗で他を巻き込まない
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 依存をlockfileどおりに同期
        run: uv sync --frozen

      - name: シミュレーション実行
        # 絶滅すると main.py はその時点で停止して結果を保存する。
        # これは失敗ではなく Exp06 の測定結果そのもの。
        run: |
          uv run python main.py --headless \
            --ticks "${{ inputs.ticks }}" \
            --seed "${{ matrix.seed }}" \
            --config "configs/exp06_${{ matrix.condition }}.json" \
            --out "runs/exp06_${{ matrix.condition }}"

      - name: 空間PNG/GIFを生成
        if: ${{ inputs.render_spatial }}
        # 光0なので背景は chemical。後処理なので失敗しても科学runは無効にしない。
        continue-on-error: true
        run: |
          SRC=$(find "runs/exp06_${{ matrix.condition }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          uv run python tools/render_spatial.py "$SRC" --background chemical --gif --fps 6

      - name: 保存対象を整理
        run: |
          set -euo pipefail
          SRC=$(find "runs/exp06_${{ matrix.condition }}" -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "run dir: $SRC"
          DST="artifact/$(basename "$SRC")"
          mkdir -p "$DST"
          cp "$SRC"/config.json "$SRC"/meta.json "$SRC"/stats.csv "$SRC"/lineages.csv "$DST"/
          cp -r "$SRC"/snapshots "$SRC"/environment "$DST"/
          if [ -d "$SRC/spatial" ]; then cp -r "$SRC"/spatial "$DST"/; fi
          if [ "${{ inputs.upload_events }}" = "true" ]; then cp "$SRC"/events.csv "$DST"/; fi
          echo "最終tick: $(tail -1 "$SRC"/stats.csv | cut -d, -f1) / 個体数: $(tail -1 "$SRC"/stats.csv | cut -d, -f2)"
          du -sh "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: exp06-${{ matrix.condition }}-seed${{ matrix.seed }}
          path: artifact/
          retention-days: 90

  collect:
    needs: [setup, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      REMOTE_BASE: ${{ vars.RCLONE_REMOTE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: 全runの成果物を取得
        uses: actions/download-artifact@v4
        with:
          pattern: exp06-*
          path: dl

      - name: 条件ごとに再構成
        run: |
          mkdir -p runs/exp06
          for d in dl/exp06-*; do
            name=$(basename "$d")
            cond=$(echo "$name" | sed -E 's/^exp06-(.+)-seed[0-9]+$/\1/')
            mkdir -p "runs/exp06/$cond"
            cp -r "$d"/* "runs/exp06/$cond"/ 2>/dev/null || true
          done
          echo "=== 条件ごとのrun数 ==="
          for c in runs/exp06/*; do
            echo "$(basename $c): $(find $c -mindepth 1 -maxdepth 1 -type d | wc -l) run"
          done
          du -sh runs/exp06

      - name: 数値実行環境の同一性を確認
        run: uv run python tools/check_env.py runs/exp06/* 2>&1 | tee env_check.txt

      - name: 健全性チェック (run数・環境・コード)
        # Exp06では絶滅 (早期終了) は測定結果であり、health_check も警告に留める。
        # run数不足・環境混在・SHA不統一は停止条件。
        id: health
        continue-on-error: true
        env:
          TICKS: ${{ inputs.ticks }}
          EXPECT_RUNS: ${{ needs.setup.outputs.seed_count }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/health_check.py runs/exp06/* --ticks "$TICKS" --expect-runs "$EXPECT_RUNS" 2>&1 | tee health.txt || rc=$?
          {
            echo ""
            echo "### 健全性チェック"
            echo "> Exp06では早期終了 (絶滅) は測定結果であり異常ではない。"
            echo '```'
            cat health.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 診断条件の成立チェック (光0・配置・chem固定)
        # 「意図した診断条件で走っていたか」。崩れていれば結果を解釈できないため
        # 停止条件にする。ただし生データの退避後に落とす。
        id: conditions
        continue-on-error: true
        env:
          SEEDS: ${{ needs.setup.outputs.seed_list }}
          CONDS: ${{ inputs.conditions }}
        run: |
          set -o pipefail
          rc=0
          uv run python tools/check_exp06.py runs/exp06 --seeds "$SEEDS" --conditions "$CONDS" 2>&1 | tee conditions.txt || rc=$?
          {
            echo ""
            echo "<details><summary>診断条件チェック</summary>"
            echo ""
            echo '```'
            tail -60 conditions.txt
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: 診断結果を要約
        env:
          TICKS: ${{ inputs.ticks }}
        run: |
          set -o pipefail
          uv run python tools/summarize_exp06.py runs/exp06 --ticks "$TICKS" 2>&1 | tee summary.txt
          {
            echo ""
            echo "## Exp06 診断結果 (GitHub Actions / Linux)"
            echo ""
            echo "> 生存/絶滅そのものが測定結果。§8の切り分けは候補であり、"
            echo "> 結論と次の1軸見直しは人が決める。"
            echo ""
            echo '```'
            cat env_check.txt
            echo '```'
            echo ""
            echo '```'
            cat summary.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 条件ごとのseed間集計
        continue-on-error: true
        run: |
          for c in runs/exp06/*; do
            uv run python tools/run_batch.py --aggregate "$c" 2>&1 | tail -10
          done

      # --- 生データのアーカイブとマニフェスト ---

      - name: 生データを圧縮しマニフェストを生成
        id: pack
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          EXP="exp06_actions_${STAMP}"
          echo "exp=$EXP" >> "$GITHUB_OUTPUT"
          mkdir -p archives "experiments/$EXP"

          for c in runs/exp06/*; do
            name="exp06_$(basename "$c")"
            tar -czf "archives/${name}.tar.gz" -C "$(dirname "$c")" "$(basename "$c")"
            REMOTE=""
            if [ -n "${REMOTE_BASE:-}" ]; then
              REMOTE="${REMOTE_BASE}/${EXP}/${name}.tar.gz"
            fi
            uv run python tools/make_manifest.py "$c" \
              --out "experiments/$EXP/$name" \
              --archive "archives/${name}.tar.gz" \
              ${REMOTE:+--remote "$REMOTE"}
          done

          cp summary.txt env_check.txt "experiments/$EXP/"
          if [ -f conditions.txt ]; then cp conditions.txt "experiments/$EXP/"; fi
          if [ -f health.txt ]; then cp health.txt "experiments/$EXP/"; fi
          echo "=== アーカイブ ==="
          ls -lh archives/

      - name: Google Drive へ生データを転送
        id: upload
        if: env.RCLONE_CONF != '' && env.REMOTE_BASE != ''
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy archives/ "${REMOTE_BASE}/${EXP}/" --progress --stats-one-line
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/rclone/rclone.conf

      - name: 転送状況を記録
        env:
          EXP: ${{ steps.pack.outputs.exp }}
        run: |
          if [ "${{ steps.upload.outputs.uploaded }}" = "true" ]; then
            MSG="生データを外部ストレージへ転送済み"
          else
            MSG="外部ストレージ未設定のため、生データは Actions 成果物のみ (90日保持)"
          fi
          echo "$MSG"
          {
            echo ""
            echo "### 生データ"
            echo "- $MSG"
            echo "- マニフェスト: \`experiments/$EXP/*/MANIFEST.md\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: 要約とチェックサムを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: exp06-summary
          path: experiments/
          retention-days: 90

      - name: 生データアーカイブを成果物として保存 (転送未設定時の保険)
        if: ${{ steps.upload.outputs.uploaded != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: exp06-rawdata
          path: archives/
          retention-days: 90

      - name: 停止条件の判定
        # 生データの退避が終わってから落とす。診断条件が崩れていたら
        # 結果を解釈させない。
        if: ${{ steps.health.outcome == 'failure' || steps.conditions.outcome == 'failure' }}
        run: |
          echo "::error::健全性チェックまたは診断条件チェックが停止条件に該当した (health.txt / conditions.txt 参照)"
          {
            echo ""
            echo "### ★ 停止条件に該当"
            echo "診断の前提が崩れているため、この結果を解釈してはいけない。"
            echo "生データと成果物は退避済み。原因を解消して再実行すること。"
          } >> $GITHUB_STEP_SUMMARY
          exit 1
